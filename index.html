    menu {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: rgba(20, 20, 30, 0.85);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;

  z-index: 1000;
}

.menu h1 {
  margin: 0;
  font-size: 24px;
}

.menu nav a {
  color: #fff;
  text-decoration: none;
  margin-left: 20px;
  font-weight: bold;
  transition: color 0.3s;
}

.menu nav a:hover {
  color: #ccc;
}

main {

     <header>

    header {
      background-color: #ffffff;
      padding: 1rem 2rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    header h1 {
      margin: 0;
    }
    .manga-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }
    .manga-card {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .manga-card:hover {
      transform: scale(1.02);
    }
    .manga-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .manga-card h2 {
      margin: 0.5rem;
      font-size: 1.1rem;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background-color: #eee;
      font-size: 0.9rem;
    }
  </style>
</head>
